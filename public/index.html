<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/start.js"></script>
</head>
<body>

    <div id="content">
        <main>
            <h1>Welcome</h1>

            <h2>People</h2>
            <button id="addperson">Add Person</button>
            <table id="peopletable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Notes</th>
                        <th>Schedule</th>
                        <th>Actions</th>
                    </tr>
                    <!-- <tr class="days">
                        <th></th>
                        <th class="day-1"></th>
                        <th class="day-2"></th>
                        <th class="day-3"></th>
                        <th class="day-4"></th>
                        <th class="day-5"></th>
                        <th class="day-6"></th>
                        <th class="day-7"></th>
                        <th></th>
                    </tr> -->
                </thead>
                <tbody>
                </tbody>
            </table>
            <h2>Rooms</h2>
            <button id="addroom">Add Room</button>
            <table id="roomstable">
                <thead>
                    <tr>
                        <th>Property Name</th>
                        <th>Address</th>
                        <th>Type</th>
                        <th>Price</th>
                        <th>Available From</th>
                        <th>Status</th>
                        <th>Landlord Contact</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </main>

<!--        <footer>
            <p>&copy; 2024 babblevoice. All rights reserved.</p>
        </footer> -->
    </div>

    <!-- Forms-->
    <div id="personform" class="container" style="display: none;">
        <form>
            <h2>Person</h2>
            <div class="form-group">
              <label for="personform-name">Name</label>
              <input type="text" id="personform-name">
            </div>
            <div class="form-group">
              <label for="personform-email">Email</label>
              <input type="email" id="personform-email">
            </div>
            <div class="form-group">
              <label for="personform-notes">Notes</label>
              <textarea id="personform-notes" rows="4"></textarea>
            </div>
            <div class="form-group">
              <label for="personform-schedule">Schedule</label>
              <input type="datetime-local" id="personform-schedule">
            </div>
            <button type="submit">Save</button>
            <button class="close" type="button">Close</button>
          </form>
    </div>

    <div id="roomform" class="container" style="display: none;">
        <form>
            <h2>Room</h2>
            <div class="form-group">
              <label for="roomform-property">Property Name</label>
              <input type="text" id="roomform-property">
            </div>
            <div class="form-group">
              <label for="roomform-address">Address</label>
              <input type="text" id="roomform-address">
            </div>
            <div class="form-group">
              <label for="roomform-type">Type</label>
              <select id="roomform-type">
                <option value="">Select type...</option>
                <option value="Studio">Studio</option>
                <option value="1BR">1 Bedroom</option>
                <option value="2BR">2 Bedroom</option>
                <option value="3BR">3 Bedroom</option>
                <option value="House">House</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="roomform-price">Price (£/month)</label>
              <input type="number" id="roomform-price" step="0.01" min="0">
            </div>
            <div class="form-group">
              <label for="roomform-available">Available From</label>
              <input type="date" id="roomform-available">
            </div>
            <div class="form-group">
              <label for="roomform-status">Status</label>
              <select id="roomform-status">
                <option value="Available">Available</option>
                <option value="Pending">Pending</option>
                <option value="Rented">Rented</option>
              </select>
            </div>
            <div class="form-group">
              <label for="roomform-landlord">Landlord Contact</label>
              <input type="email" id="roomform-landlord">
            </div>
            <div class="form-group">
              <label for="roomform-notes">Notes</label>
              <textarea id="roomform-notes" rows="4"></textarea>
            </div>
            <button type="submit">Save</button>
            <button class="close" type="button">Close</button>
          </form>
    </div>
