<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work!</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/start.js"></script>
  </head>
  <body>
    <div id="content">
      <main>
        <h1>Welcome</h1>

        <h2>People</h2>
        <button id="addperson">Add Person</button>
        <table id="peopletable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Notes</th>
              <th>Schedule</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </main>

      <!--        <footer>
            <p>&copy; 2024 babblevoice. All rights reserved.</p>
        </footer> -->
    </div>

    <!-- Forms-->
    <div id="personform" class="container" style="display: none">
      <form>
        <h2>Person</h2>
        <div class="form-group">
          <label for="personform-name">Name</label>
          <input type="text" id="personform-name" />
        </div>
        <div class="form-group">
          <label for="personform-email">Email</label>
          <input type="email" id="personform-email" />
        </div>
        <div class="form-group">
          <label for="personform-notes">Notes</label>
          <textarea id="personform-notes" rows="4"></textarea>
        </div>
        <div class="form-group">
          <label>Weekly Schedule</label>
          <div class="schedule-grid">
            <div class="schedule-day">
              <label for="personform-schedule-0">Monday</label>
              <select id="personform-schedule-0">
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
                <option value="Off">Off</option>
              </select>
            </div>
            <div class="schedule-day">
              <label for="personform-schedule-1">Tuesday</label>
              <select id="personform-schedule-1">
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
                <option value="Off">Off</option>
              </select>
            </div>
            <div class="schedule-day">
              <label for="personform-schedule-2">Wednesday</label>
              <select id="personform-schedule-2">
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
                <option value="Off">Off</option>
              </select>
            </div>
            <div class="schedule-day">
              <label for="personform-schedule-3">Thursday</label>
              <select id="personform-schedule-3">
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
                <option value="Off">Off</option>
              </select>
            </div>
            <div class="schedule-day">
              <label for="personform-schedule-4">Friday</label>
              <select id="personform-schedule-4">
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
                <option value="Off">Off</option>
              </select>
            </div>
            <div class="schedule-day">
              <label for="personform-schedule-5">Saturday</label>
              <select id="personform-schedule-5">
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
                <option value="Off">Off</option>
              </select>
            </div>
            <div class="schedule-day">
              <label for="personform-schedule-6">Sunday</label>
              <select id="personform-schedule-6">
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
                <option value="Off">Off</option>
              </select>
            </div>
          </div>
        </div>
        <button type="submit">Save</button>
        <button class="close" type="button">Close</button>
      </form>
    </div>

    <div id="workflowform" class="container" style="display: none">
      <form>
        <h2>Workflow</h2>
        <div class="form-group">
          <label for="workflowform-name">Name</label>
          <input type="text" id="workflowform-name" />
        </div>
        <div class="form-group">
          <label for="workflowform-notes">Notes</label>
          <textarea id="workflowform-notes" rows="4"></textarea>
        </div>
        <button type="submit">Save</button>
        <button class="close" type="button">Close</button>
      </form>
    </div>

    <div id="workflowstepsform" class="container" style="display: none">
      <form>
        <h2>Workflow Steps</h2>
        <div class="form-group">
          <label for="workflowform-name">Name</label>
          <input type="text" id="workflowform-name" readonly />
        </div>

        <div class="ganttchart">
          <div class="gantttask" style="width: 30%; left: 0%; top: 0%">
            Task 1
          </div>
          <div class="gantttask" style="width: 40%; left: 30%; top: 20%">
            Task 2
          </div>
          <!-- Add more tasks as needed -->
        </div>

        <button type="button">Add</button>
        <button class="close" type="button">Close</button>
      </form>
    </div>

    <!-- Schedule Display Modal -->
    <div id="scheduleModal" class="container" style="display: none">
      <div class="schedule-modal-content">
        <h2 id="scheduleModalTitle">Schedule for Person</h2>
        <div class="schedule-display">
          <div class="schedule-row">
            <span class="day-label">Monday:</span>
            <span id="schedule-day-0" class="day-status">Available</span>
          </div>
          <div class="schedule-row">
            <span class="day-label">Tuesday:</span>
            <span id="schedule-day-1" class="day-status">Available</span>
          </div>
          <div class="schedule-row">
            <span class="day-label">Wednesday:</span>
            <span id="schedule-day-2" class="day-status">Available</span>
          </div>
          <div class="schedule-row">
            <span class="day-label">Thursday:</span>
            <span id="schedule-day-3" class="day-status">Available</span>
          </div>
          <div class="schedule-row">
            <span class="day-label">Friday:</span>
            <span id="schedule-day-4" class="day-status">Available</span>
          </div>
          <div class="schedule-row">
            <span class="day-label">Saturday:</span>
            <span id="schedule-day-5" class="day-status">Available</span>
          </div>
          <div class="schedule-row">
            <span class="day-label">Sunday:</span>
            <span id="schedule-day-6" class="day-status">Available</span>
          </div>
        </div>
        <button class="close" type="button">Close</button>
      </div>
    </div>
  </body>
</html>
